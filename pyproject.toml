[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "agentx"
version = "0.1.0"
description = "Multi-Agent Collaboration Framework for Legal Domain Tasks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "faiss-cpu>=1.15.0",
    "redis>=5.2",
    "python-dotenv>=1.1",
    "slowapi>=0.1.9",
    "httpx>=0.28",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.18",
    "pypdf>=5.0.0",
    "pycryptodome>=3.20.0",
    "cryptography>=43.0.0",
]

[project.scripts]
agentx = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "black>=25.1",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
